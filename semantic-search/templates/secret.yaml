{{ range $key, $value := .Values.secrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "app.fullname" $ }}-{{ $key }}-secret
  labels:
    {{- include "app.labels" $ | nindent 4 }}
type: Opaque
data:
  {{- range $secretKey, $secretValue := $value }}
  {{ $secretKey }}: "{{ $secretValue | b64enc }}"
  {{- end }}
---
{{ end }}